<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>

<body>
    <!--
        <h1> título maior "Matrícula Escola Online"
        <form> cria um formulário HTML para receber dados do usuário
        <fieldset> cria um campo de linha 
        <legend> Título dado para a fieldset
        <label> cria um nome para o campo que o usuário vai preencher
        <input> seleciona o tipo de dado, e cria um campo onde o usuário vai preencher. pode ser do tipo text, date, password, radio e checkbox. Esses tipos são usados na página HTML.
        o atributo placeholder é usado para deixar algum exemplo escrito, em um tom mais claro, para que o usuário entenda com o que ele deve preencher
        o atributo required é usado para que o campo tenha que ser respondido obrigatoriamente.
        <select> abre uma caixa de seleção para o usuário escolher a opção
        <option> é onde descrevemos as opções que estarão dentro da caixa de texto
        <button> cria botoões
    -->

    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo:</label>  
            <input type="text" id="nome" nome="nome" required>
            <P> </P>
            <label for="data"> Data de Nascimento:</label>
            <input type="date" id="data" nome="data" required>
            <P> </P>
            <label for="email">E-mail do Aluno:</label>
            <input type="text" id="email" nome="email" placeholder="aluno@exemplo.com" required>
            <P> </P>
            <label for="senha">Senha de Acesso:</label>
            <input type="password" id="senha" nome="senha" placeholder="*********" required>
            <P> </P>
            <label for="telefone">Telefone de Emergência:</label>
            <input type="tel" id="telefone" nome="telefone" placeholder="(00) 00000-0000" required>
        </fieldset>

        <fieldset>
            <legend>Preferências de Estudo</legend>
            <p>Áreas de Interesse:</p>
            <input type="checkbox" id="front" name="interesses" value="Front-end">
            <label for="front">Front-end</label>
            <P> </P>
            <input type="checkbox" id="musica" name="interesses" value="Back-end">
            <label for="back">Back-end</label>
            <P> </P>
            <input type="checkbox" id="leitura" name="interesses" value="Design">
            <label for="design">Design</label>
            <P> </P>
            <input type="checkbox" id="dados" name="interesses" value="Dados">
            <label for="dados">Dados</label>
            <P> </P>
            <label for="conheceu">Como conheceu a escola?</label>
            <select id="estado" name="estado">
                <option value=""selected>Selecione...</option>
                <option value="indicacao">Indicação</option>
                <option value="google">Google</option>
                <option value="redes_sociais">Redes Sociais</option>
            </select>
        </fieldset>
           <P> </P>
        <button type="submit">Matricular</button>
        <button type="reset">Limpar</button>
    </form>

</body>

</html>
