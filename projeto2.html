<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>

<body>
    <form>
        <h1>Finalizar Compra</h1>
        <fieldset>
            <legend>Endereço de Entrega</legend>
            <label for="nome">Nome do Destinatário:</label>
            <input type="text" id="nome" name="nome" required>
            <p> </p>

            <label for="cep"> CEP:</label>
            <input type="text" id="cep" name="cep" size="9" placeholder="00000-0000" required>
            <p> </p>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua" size="40" required>
            <p> </p>

            <label for="numero">Número:</label>
            <input type="number" id="numero" name="numero" required>
            <p></p>
            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, Ponto de Referência"
                required>

        </fieldset>

        <fieldset>
            <legend>Opções de Entrega</legend>
            <label for="periodo_entrega">Período de Entrega:</label>
            <select id="periodo_entrega" name="periodo_entrega">
                <option value="manha">Manhã (08h-12h)</option>
                <option value="tarde">Tarde (12h-18h)</option>
                <option value="noite">Noite (18h-22h)</option>
            </select>

            <p> </p>
            <label for="text">Instruções de Entrega</label>
            <p> </p>
            <input type="radio" id="portaria" name="instrucoes" value="portaria">
            <label for="portaria">Deixar na portaria</label>
            <br>
            <input type="radio" id="maos" name="instrucoes" value="maos">
            <label for="maos">Entregar em mãos</label>
            <br>
            <input type="radio" id="ligar" name="instrucoes" value="ligar">
            <label for="ligar">Ligar ao chegar</label>
            <p> </p>
            <label for="cupom">Cupom de Desconto:</label>
            <input type="text" id="cupom name" cupom" placeholder="Insira seu cupom">
            <p> </p>
            <input type="checkbox" id="ofertas" name="ofertas">
            <label for="ofertas">Receber ofertas pelo WhatsApp</label>
        </fieldset>
        <p> </p>
        <button>Finalizar Compra</button>
    </form>
</body>

</html>
